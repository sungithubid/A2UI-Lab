version: "2"
sql:
  - name: lab
    engine: sqlite
    schema: internal/platform/database/migrations
    queries: internal/modules/lab/queries.sql
    gen:
      go:
        package: dbgen
        out: internal/modules/lab/dbgen
        sql_package: database/sql
        emit_empty_slices: true
        omit_unused_structs: true
        initialisms: [id]
